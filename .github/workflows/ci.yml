name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install native audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon ffmpeg lame pkg-config libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-host-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  qt:
    name: Desktop Qt integration and QML smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg lame cmake ninja-build pkg-config dbus-daemon libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/qt-tools
          key: ${{ runner.os }}-qt-host-linguist-6.11.2-${{ hashFiles('Cargo.lock') }}
      - name: Build desktop release and integration fixture
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/desktop --parallel 2
      - name: Run isolated local Qt tests
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-diagnostics
          path: build/desktop/Testing/Temporary/
          if-no-files-found: ignore

  qml:
    name: QML syntax (including Silica)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt5 syntax verifier
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools
      - name: Parse all presentation QML
        # Qt5 qmllint is syntax-only: unavailable Sailfish/Nemo imports do not
        # masquerade as syntax failures. Runtime Qt6 tests run separately.
        run: /usr/lib/qt5/bin/qmllint app/qml/*.qml app/qml/shared/*.qml app/qml/pages/*.qml app/qml/desktop/*.qml

  i18n:
    name: Translation freshness (39 locales)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/qt-tools
          key: ${{ runner.os }}-linguist-6.11.2
      - run: bash tools/build-qm.sh --check

  rust-cross:
    name: Rust aarch64 (actual Sailfish sysroot)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for Sailfish SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-unknown-linux-gnu
          key: ${{ runner.os }}-sailfish-5.2-audio-${{ hashFiles('Cargo.lock', 'tools/audio-sdk.Dockerfile') }}
      - name: Prepare SDK development image
        run: docker build -f tools/audio-sdk.Dockerfile -t plexfreq-audio-sdk:local .
      - name: Cross-compile staticlib against SDK facts
        env:
          SDK_IMAGE: plexfreq-audio-sdk:local
          SDK_TARGET: SailfishOS-5.2.0.15-aarch64
          CC_aarch64_unknown_linux_gnu: ${{ github.workspace }}/tools/sdk-cc.sh
          AR_aarch64_unknown_linux_gnu: ar
          PKG_CONFIG_aarch64_unknown_linux_gnu: ${{ github.workspace }}/tools/sdk-pkg-config.sh
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu --lib
