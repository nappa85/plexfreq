name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain branch 'stable'; a SHA ref needs an explicit toolchain input.
      - id: toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install native audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon ffmpeg lame pkg-config libpulse-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-host-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  qt:
    name: Desktop Qt integration and QML smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain branch 'stable'; a SHA ref needs an explicit toolchain input.
      - id: toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg lame cmake ninja-build pkg-config dbus-daemon libpulse-dev qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/desktop/cargo-target
            ~/.cache/qt-tools
          key: ${{ runner.os }}-qt-host-linguist-6.11.2-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Build desktop release and integration fixture
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/desktop --parallel 2
      - name: Run isolated local Qt tests
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-diagnostics
          path: build/desktop/Testing/Temporary/
          if-no-files-found: ignore

  qml:
    name: QML syntax (including Silica)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt5 syntax verifier
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools
      - name: Parse all presentation QML
        # Qt5 qmllint is syntax-only: unavailable Sailfish/Nemo imports do not
        # masquerade as syntax failures. Runtime Qt6 tests run separately.
        run: /usr/lib/qt5/bin/qmllint app/qml/*.qml app/qml/shared/*.qml app/qml/pages/*.qml app/qml/desktop/*.qml

  i18n:
    name: Translation freshness (39 locales)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/qt-tools
          key: ${{ runner.os }}-linguist-6.11.2
      - run: bash tools/build-qm.sh --check

  harbour:
    name: Sailfish RPM build and Harbour validation (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for Sailfish SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h
      # dtolnay/rust-toolchain branch 'stable'; a SHA ref needs an explicit toolchain input.
      - id: toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-unknown-linux-gnu
          key: ${{ runner.os }}-sailfish-5.2-audio-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/audio-sdk.Dockerfile') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/qt-tools
          key: ${{ runner.os }}-linguist-6.11.2
      # Same scripts as local packaging and release.yml: cross-compiles the
      # staticlib against the SDK sysroot, then mb2 builds the RPM (rpmlint).
      - name: Build RPM with the documented SDK script
        run: ./tools/build-sailfish.sh
      - name: Harbour validation (mb2 check --suites harbour)
        run: ./tools/check-harbour.sh
