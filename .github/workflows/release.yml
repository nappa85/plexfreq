name: Build and publish packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates before packaging
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Sailfish RPM and device fixture
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check committed release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 tools/release-version.py --tag "$RELEASE_TAG"
      - name: Free disk space for Sailfish SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h
      # dtolnay/rust-toolchain branch 'stable'; a SHA ref needs an explicit toolchain input.
      - id: toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-unknown-linux-gnu
          key: ${{ runner.os }}-sailfish-5.2-audio-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/audio-sdk.Dockerfile') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/qt-tools
          key: ${{ runner.os }}-linguist-6.11.2
      - name: Build with documented SDK scripts
        run: |
          ./tools/build-sailfish.sh
          ./tools/check-harbour.sh
          ./tools/build-device-tests.sh
      - name: Check RPM version and architecture
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          found=0
          for package in build/sailfish/RPMS/*.rpm; do
            test -f "$package" || continue
            found=1
            test "$(rpm -qp --qf '%{VERSION}' "$package")" = "$EXPECTED_VERSION"
            test "$(rpm -qp --qf '%{ARCH}' "$package")" = aarch64
          done
          test "$found" = 1
      - uses: actions/upload-artifact@v7
        with:
          name: sailfish-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            build/sailfish/RPMS/*.rpm
            build/device-tests/plexfreq-backend-test
            build/device-tests/RPMS/*.rpm

  desktop:
    name: Build Linux amd64 desktop archive
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check committed release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 tools/release-version.py --tag "$RELEASE_TAG"
      # dtolnay/rust-toolchain branch 'stable'; a SHA ref needs an explicit toolchain input.
      - id: toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt, audio and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config file dbus-daemon libpulse-dev qt6-base-dev qt6-declarative-dev qt6-qpa-plugins qt6-wayland qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/qt-tools
          key: ${{ runner.os }}-desktop-package-linguist-6.11.2-${{ hashFiles('Cargo.lock') }}
      - name: Build and package desktop release
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/desktop --parallel 2
          cpack --config build/desktop/CPackConfig.cmake -B build/packages
      - name: Extract and smoke-test desktop archive
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PLEXFREQ_AUDIO_SINK: fake
        run: |
          bundle="plexfreq-${EXPECTED_VERSION}-linux-amd64"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "build/packages/${bundle}.tar.gz" -C "$stage"
          executable="$stage/$bundle/bin/plexfreq"
          test -x "$executable"
          file "$executable" | grep -q 'ELF 64-bit.*x86-64'
          test -f "$stage/$bundle/share/doc/plexfreq/README.md"
          dbus-run-session -- bash tools/smoke-test.sh "$executable"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: build/packages/plexfreq-*-linux-amd64.tar.gz

  publish:
    name: Publish tag release
    if: github.event_name == 'push'
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sailfish-${{ needs.build.outputs.version }}
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ needs.build.outputs.version }}
          path: packages/desktop
      # softprops/action-gh-release v2.6.2
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            packages/sailfish/RPMS/*.rpm
            packages/desktop/plexfreq-*-linux-amd64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
