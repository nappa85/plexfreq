[package]
name = "plexfreq-core"
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "plexfreq_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
fs2 = "0.4"
libc = "0.2"
futures-util = "0.3"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }
rubato = { version = "5.0.1", default-features = false }
zbus = { version = "4", default-features = false, features = ["tokio", "blocking"] }
libpulse-sys = { version = "1.23", default-features = false, features = ["pa_v12"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
